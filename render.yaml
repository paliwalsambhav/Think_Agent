services:
  - type: web
    name: Think_Agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_REASON_MODEL
        value: openai/gpt-oss-120b
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"